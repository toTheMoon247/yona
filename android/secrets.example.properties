# Yona Android — local secrets template.
# Copy this file to `secrets.properties` (gitignored) and fill in real values.
# These are read at build time and exposed via generated BuildConfig fields.
# On CI, the same keys can be supplied as environment variables instead.
#
# Values mirror the iOS app's git-ignored Supabase.plist (same Supabase project).

SUPABASE_URL=https://YOUR-PROJECT-REF.supabase.co
SUPABASE_ANON_KEY=your-supabase-anon-key
BRANDFETCH_CLIENT_ID=your-brandfetch-client-id

# Yona Android — release signing template.
# Copy to `keystore.properties` (gitignored) and point it at your upload keystore.
# The keystore itself (*.jks) is also gitignored — keep a safe backup of it.
#
# Generate an upload keystore:
#   keytool -genkeypair -v -keystore upload-keystore.jks -alias upload \
#     -keyalg RSA -keysize 2048 -validity 10000
#
# With Play App Signing, Google holds the real app-signing key; this is only the
# upload key (resettable via Google if ever lost — but back it up anyway).

storeFile=upload-keystore.jks
storePassword=your-store-password
keyAlias=upload
keyPassword=your-key-password

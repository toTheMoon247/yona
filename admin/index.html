<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yona · Admin</title>
  <style>
    :root { --blue: #2563EB; --line: #e5e7eb; --muted: #6b7280; --bg: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
           color: #111827; background: var(--bg); }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 20px;
             background: #fff; border-bottom: 1px solid var(--line); }
    header .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--blue); }
    header h1 { font-size: 16px; margin: 0; }
    header .right { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 12px; }
    header .right a { color: var(--blue); cursor: pointer; }
    main { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 53px); }
    .pane { overflow-y: auto; }
    .users { border-right: 1px solid var(--line); background: #fff; }
    .user { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .user:hover { background: #f3f4f6; }
    .user.active { background: #eaf1fe; box-shadow: inset 3px 0 0 var(--blue); }
    .user .email { font-weight: 600; overflow-wrap: anywhere; }
    .user .meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
            background: #eef2ff; color: var(--blue); text-transform: capitalize; }
    .pill.count { background: #ecfdf5; color: #047857; }
    .detail { padding: 20px 24px; }
    .detail h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
    .detail .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line);
            border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { background: #fafafa; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    a { color: var(--blue); text-decoration: none; }
    /* Login gate */
    .gate { display: grid; place-items: center; height: calc(100vh - 53px); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;
            width: 340px; max-width: 90vw; }
    .card h2 { margin: 0 0 6px; font-size: 17px; }
    .card p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
    .card button { width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 8px;
                   background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .card .msg { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="mark"></div>
    <h1>Yona · Admin</h1>
    <span class="right">
      <span id="userCount"></span>
      <span id="whoami"></span>
      <a id="signout" hidden>Sign out</a>
    </span>
  </header>

  <div id="boot" class="gate"><div class="empty">Loading…</div></div>

  <div id="login" class="gate" hidden>
    <div class="card">
      <h2>Admin sign-in</h2>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password"
             style="margin-top:10px" />
      <button id="signin">Sign in</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <main id="app" hidden>
    <div class="pane users" id="users"><div class="empty">Loading…</div></div>
    <div class="pane detail" id="detail"><div class="empty">Select a user to see their subscriptions.</div></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const cfg = window.YONA_CONFIG;
    const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
    const FN = `${cfg.url}/functions/v1/admin`;

    const $ = (id) => document.getElementById(id);
    const show = (view) => ['boot', 'login', 'app'].forEach((v) => ($(v).hidden = v !== view));
    const fmtDate = (s) => (s ? new Date(s).toLocaleDateString() : '—');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function callFn(body) {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify(body),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);
      return out;
    }

    async function loadUsers() {
      const el = $('users');
      try {
        const users = await callFn({ action: 'list-users' });
        $('userCount').textContent = `${users.length} user${users.length === 1 ? '' : 's'}`;
        el.innerHTML = users.map((u) => `
          <div class="user" data-id="${u.id}" onclick="selectUser('${u.id}', this)">
            <div class="email">${esc(u.email)}</div>
            <div class="meta">
              <span class="pill">${esc(u.provider)}</span>
              <span class="pill count">${u.subscriptions} sub${u.subscriptions === 1 ? '' : 's'}</span>
              <span>joined ${fmtDate(u.created_at)}</span>
            </div>
          </div>`).join('') || '<div class="empty">No users yet.</div>';
      } catch (e) {
        el.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function selectUser(id, node) {
      document.querySelectorAll('.user').forEach((n) => n.classList.toggle('active', n === node));
      const email = node.querySelector('.email').textContent;
      const detail = $('detail');
      detail.innerHTML = `<h2>${esc(email)}</h2><div class="sub">Loading subscriptions…</div>`;
      try {
        const tiles = await callFn({ action: 'user-tiles', userId: id });
        const rows = tiles.map((t) => `
          <tr>
            <td>${esc(t.title)}</td>
            <td>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noreferrer">${esc(t.url)}</a>` : '—'}</td>
            <td>${t.cost_amount != null ? `${t.cost_amount} ${esc(t.cost_period ?? '')}` : '—'}</td>
            <td>${esc(t.billing_source ?? '—')}</td>
            <td>${esc(t.payment_method ?? '—')}</td>
            <td>${fmtDate(t.created_at)}</td>
          </tr>`).join('');
        detail.innerHTML = `
          <h2>${esc(email)}</h2>
          <div class="sub">${tiles.length} subscription${tiles.length === 1 ? '' : 's'}</div>
          ${tiles.length ? `<table>
            <thead><tr><th>Title</th><th>Website</th><th>Cost</th><th>Billed via</th><th>Method</th><th>Added</th></tr></thead>
            <tbody>${rows}</tbody></table>` : '<div class="empty">No subscriptions.</div>'}`;
      } catch (e) {
        detail.innerHTML = `<h2>${esc(email)}</h2><div class="empty">${esc(e.message)}</div>`;
      }
    }
    window.selectUser = selectUser;

    function startApp(session) {
      $('whoami').textContent = session.user.email;
      $('signout').hidden = false;
      show('app');
      loadUsers();
    }

    async function signIn() {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return;
      $('loginMsg').textContent = 'Signing in…';
      // Stateless: one request, no redirect/hash/token dance. On success,
      // onAuthStateChange fires and swaps to the dashboard.
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) $('loginMsg').textContent = error.message;
    }
    $('signin').onclick = signIn;
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
    $('signout').onclick = async () => { await sb.auth.signOut(); };

    sb.auth.onAuthStateChange((_e, session) => {
      if (session) startApp(session);
      else { $('whoami').textContent = ''; $('signout').hidden = true; show('login'); }
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) startApp(session);
      else show('login');
    })();
  </script>
</body>
</html>
